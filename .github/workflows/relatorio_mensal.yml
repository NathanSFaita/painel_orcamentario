name: Envio de Relatório Mensal

on:
  schedule:
    # Executa às 12:00 UTC (09:00 no horário de Brasília, UTC-3) no dia 1 de cada mês.
    - cron: "0 12 1 * *"
  workflow_dispatch: # Permite a execução manual pela interface do GitHub

jobs:
  enviar-relatorio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de envio de relatório
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python relatorio_mensal.py
