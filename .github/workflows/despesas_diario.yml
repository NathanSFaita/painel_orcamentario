name: Atualizar base de despesas

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-despesas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # evita conflitos de push

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar identidade do Git (OBRIGATÓRIO)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Extrair empenhos
        env:
          API_TOKEN_SF: ${{ secrets.API_TOKEN_SF }}
        run: |
          python empenho_v2.py
      
      - name: Executar coleta de despesas (atualiza Excel)
        env:
          API_TOKEN_SF: ${{ secrets.API_TOKEN_SF }}
        run: |
          python despesas.py
         
      - name: Registrar data/hora da atualização (rastro oficial)
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > base_despesas/_ultima_atualizacao.txt

      - name: Criar arquivo de versão para FORÇAR redeploy no Heroku
        run: |
          echo "ultima_execucao=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > version.txt

      - name: Commit e push (base + rastro + versão)
        run: |
          git add base_despesas version.txt
          git commit -m "Atualização automática diária da base" || echo "Nada para commitar"
          git push origin main
